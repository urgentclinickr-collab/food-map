<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어전트의원 맛집지도</title>
<meta name="description" content="맛잘알 원장님의 숨겨놓은 리스트. 어전트의원 직원들이 직접 다녀와서 추천하는 근처 맛집.">
<meta property="og:title" content="어전트의원 근처 맛집">
<meta property="og:description" content="맛잘알 원장님의 숨겨놓은 리스트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: 한 줄 세로 리스트(식권 모양 카드) + 상단 고정 필터. 거리 그룹 순서로 번호가 이어짐 */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --fg: #18221e;
  --muted: #5c6b64;
  --line: #dde3df;
  --accent: #0d7356;
  --accent-soft: #e2f1eb;
  --yolk: #f3b33d;
  --yolk-soft: #fdf1d6;
  --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111815; --surface: #19221e; --fg: #e7eeea; --muted: #9aaba3; --line: #2a3631;
    --accent: #4cc39b; --accent-soft: #173229; --yolk: #f5c362; --yolk-soft: #3a2f17;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { padding-block: 28px 18px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 44px); line-height: 1.15; margin: 6px 0 10px; text-wrap: balance; }
h1 span { color: var(--accent); }
.tagline { display: inline-block; margin: 10px 0 0; background: var(--yolk); color: #2a1f05; font-weight: 700; font-size: 14px; border-radius: 6px; padding: 3px 10px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.addr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.addr .pin { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); flex: none; }
.addr p { margin: 0; flex: 1 1 220px; min-width: 0; font-size: 14px; }
.addr p b { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.btn { font: inherit; font-size: 13px; font-weight: 700; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 6px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, .map:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { font: inherit; font-size: 13px; font-weight: 500; flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 13px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }

.pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; background: var(--yolk-soft); border-radius: 10px; padding: 12px 14px; }
.pick p { margin: 0; flex: 1 1 200px; min-width: 0; font-size: 14px; }
.pick strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.pick .btn { background: var(--yolk); border-color: var(--yolk); color: #2a1f05; }

section { margin-top: 26px; }
.ghead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.ghead h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
.ghead small { color: var(--muted); font-size: 13px; }

.list { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 44px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card.hl { border-color: var(--yolk); box-shadow: 0 0 0 3px var(--yolk-soft); }
.num { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-family: var(--display); font-size: 20px; border-right: 1px dashed var(--line); font-variant-numeric: tabular-nums; }
.body { padding: 12px 14px; min-width: 0; display: grid; gap: 6px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top h3 { margin: 0; font-size: 17px; font-weight: 700; }
.cat { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.meal { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; background: var(--accent-soft); color: var(--accent); }
.meal-dinner { background: var(--fg); color: var(--bg); }
.meal-lunch { background: var(--yolk); color: #2a1f05; }
.pr { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 7px; background: var(--yolk-soft); color: var(--fg); }
.fr { font-size: 12px; color: var(--muted); margin-left: -4px; }
.lv { font-size: 12px; font-weight: 700; border-radius: 4px; padding: 1px 8px; }
.lv-top { background: var(--accent); color: var(--surface); }
.lv-rec { border: 1px solid var(--accent); color: var(--accent); }
.lv-mixed { border: 1px solid var(--line); color: var(--muted); }
.feats { margin: 0; font-size: 13px; font-weight: 700; color: var(--accent); }
.chips + .chips { margin-top: 6px; }
.chip.sub { font-size: 12px; padding: 4px 11px; }
.bt { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 6px; border: 1px dashed var(--muted); color: var(--muted); }
.menu { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; padding: 0; list-style: none; }
.menu li { font-size: 13px; background: var(--yolk-soft); border-radius: 4px; padding: 1px 8px; }
.memo { margin: 0; font-size: 14px; color: var(--muted); }
.map { justify-self: start; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.map:hover { text-decoration: underline; }

/* 지도 */
.mapsec { margin-top: 32px; }
.mapbox { margin-top: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
#map { height: 380px; width: 100%; background: #e8ece9; }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.maplegend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; margin-right: 4px; }
.pin { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); box-shadow: 0 1px 3px rgba(0,0,0,.35); border: 2px solid #0d7356; background: #fff; color: #0d7356; }
.pin.top { background: #0d7356; color: #fff; }
.pin.mixed { border-color: #8a958f; color: #5c6b64; }
.pin.home { width: 34px; height: 34px; background: #f3b33d; border-color: #2a1f05; color: #2a1f05; font-size: 11px; }
.leaflet-popup-content { font-family: var(--body); font-size: 13px; line-height: 1.5; margin: 10px 12px; }
.leaflet-popup-content b { font-size: 14px; }
.leaflet-popup-content a { color: #0d7356; font-weight: 700; }
.leaflet-div-icon { background: transparent; border: 0; }
.onmap { justify-self: start; font: inherit; font-size: 13px; font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
.links { display: flex; gap: 14px; flex-wrap: wrap; }

footer { color: var(--muted); font-size: 12px; padding-block: 32px 40px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .2s, border-color .2s; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">URGENT CLINIC · 영등포</div>
    <p class="tagline">맛잘알 원장님의 숨겨놓은 리스트</p>
    <h1>어전트의원 <span>근처 맛집</span></h1>
    <p class="lede">어전트의원 직원들이 직접 다녀와서 추천하는 곳이에요. 진료 전후나 치료를 기다리는 동안 들러 보세요.</p>
    <div class="addr">
      <span class="pin" aria-hidden="true"></span>
      <p><b>출발 기준</b><span id="addr"></span></p>
      <button class="btn" id="copy" type="button">주소 복사</button>
      <a class="btn" id="clinicMap" target="_blank" rel="noopener">지도 보기</a>
    </div>
  </header>
</div>

<div class="bar">
  <div class="wrap"><div class="chips" id="chips" role="group" aria-label="음식 종류"></div><div class="chips" id="chips2" role="group" aria-label="평가"></div></div>
</div>

<main class="wrap">
  <div class="pick">
    <p>메뉴가 고민될 땐 <strong id="pickName">한 곳 골라 드릴게요</strong></p>
    <button class="btn" id="pickBtn" type="button">오늘 뭐 먹지?</button>
  </div>
  <div id="groups"></div>
  <section class="mapsec" id="map-section">
    <div class="ghead"><h2>지도로 보기</h2><small>핀을 누르면 식당 정보가 나와요</small></div>
    <div class="mapbox">
      <div id="map" role="region" aria-label="맛집 위치 지도"></div>
      <div class="maplegend"><span><i style="background:#f3b33d;border:2px solid #2a1f05"></i>어전트의원</span><span><i style="background:#0d7356"></i>강추</span><span><i style="background:#fff;border:2px solid #0d7356"></i>추천</span><span><i style="background:#fff;border:2px solid #8a958f"></i>기타</span><span>핀 번호 = 목록 번호</span></div>
    </div>
  </section>
  <footer>번호는 인쇄용 안내지와 같아요. 브레이크타임 시간과 휴무일은 지도 링크에서 확인해 주세요.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- data.js를 고치면 아래 v= 숫자도 바꿔 주세요 (예전 파일이 보이는 것을 막아요) -->
<script src="data.js?v=8"></script>
<script>
(function () {
  var C = window.CLINIC, G = window.GROUPS, P = window.PLACES;
  var state = { cat: "전체", feat: "" };
  var FEATS = [["", "평가 전체"], ["강추", "강추만"], ["가성비", "가성비"], ["푸짐해요", "푸짐해요"], ["정갈해요", "정갈해요"], ["price:p1", "1만원 이하"]];
  function match(p) {
    if (state.cat !== "전체" && p.cat !== state.cat) return false;
    if (state.feat.indexOf("price:") === 0) { if (p.price !== state.feat.slice(6)) return false; }
    else if (state.feat && (p.tags || []).indexOf(state.feat) < 0) return false;
    return true;
  }
  try { var saved = localStorage.getItem("cat"); if (saved) state.cat = saved; } catch (e) {}

  document.getElementById("addr").textContent = C.address;
  document.getElementById("clinicMap").href = "https://map.naver.com/p/search/" + encodeURIComponent(C.mapQuery);
  var copyBtn = document.getElementById("copy");
  copyBtn.addEventListener("click", function () {
    var done = function () { copyBtn.textContent = "복사됨"; setTimeout(function () { copyBtn.textContent = "주소 복사"; }, 1600); };
    try {
      navigator.clipboard.writeText(C.address).then(done, function () { selectAddr(); });
    } catch (e) { selectAddr(); }
  });
  function selectAddr() {
    var r = document.createRange(); r.selectNodeContents(document.getElementById("addr"));
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  var cats = ["전체"];
  P.forEach(function (p) { if (cats.indexOf(p.cat) < 0) cats.push(p.cat); });
  if (cats.indexOf(state.cat) < 0) state.cat = "전체";
  var chips = document.getElementById("chips");
  cats.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.id = "chip-" + c; b.textContent = c;
    b.addEventListener("click", function () {
      state.cat = c;
      try { localStorage.setItem("cat", c); } catch (e) {}
      render();
    });
    chips.appendChild(b);
  });

  var chips2 = document.getElementById("chips2");
  FEATS.forEach(function (f, i) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip sub"; b.id = "feat-" + i; b.textContent = f[1]; b.dataset.v = f[0];
    b.addEventListener("click", function () { state.feat = f[0]; render(); });
    chips2.appendChild(b);
  });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render(highlight) {
    Array.prototype.forEach.call(chips.children, function (b) { b.setAttribute("aria-pressed", b.textContent === state.cat ? "true" : "false"); });
    Array.prototype.forEach.call(chips2.children, function (b) { b.setAttribute("aria-pressed", b.dataset.v === state.feat ? "true" : "false"); });
    var any = false;
    var root = document.getElementById("groups"); root.innerHTML = "";
    G.forEach(function (g) {
      var items = P.filter(function (p) { return p.group === g.id && match(p); });
      if (!items.length) return;
      any = true;
      var sec = el("section"); var h = el("div", "ghead");
      h.appendChild(el("h2", null, g.label)); h.appendChild(el("small", null, g.note));
      sec.appendChild(h);
      var list = el("div", "list");
      items.forEach(function (p) {
        var card = el("article", "card" + (highlight === p.no ? " hl" : "")); card.id = "p" + p.no;
        card.appendChild(el("div", "num", p.no));
        var body = el("div", "body"); var top = el("div", "top");
        top.appendChild(el("h3", null, p.name));
        if (p.franchise) top.appendChild(el("span", "fr", "(프랜차이즈)"));
        var lv = window.levelOf(p);
        if (lv) top.appendChild(el("span", "lv " + (lv === "강추" ? "lv-top" : lv === "추천" ? "lv-rec" : "lv-mixed"), lv));
        top.appendChild(el("span", "cat", p.cat));
        if (p.price && window.PRICE_LABEL) top.appendChild(el("span", "pr", window.PRICE_LABEL[p.price]));
        if (p.meal && window.MEAL_LABEL[p.meal]) top.appendChild(el("span", "meal meal-" + p.meal, window.MEAL_LABEL[p.meal]));
        if (p.bt === true) top.appendChild(el("span", "bt", "브레이크타임 있음"));
        body.appendChild(top);
        if (p.menu.length) {
          var ul = el("ul", "menu"); ul.setAttribute("aria-label", "추천 메뉴");
          p.menu.forEach(function (m) { ul.appendChild(el("li", null, m)); });
          body.appendChild(ul);
        }
        var fs = window.featuresOf(p);
        if (fs.length) body.appendChild(el("p", "feats", fs.join(" · ")));
        if (p.memo) body.appendChild(el("p", "memo", p.memo));
        var links = el("div", "links");
        if (p.lat && window.L) {
          var mb = el("button", "onmap", "지도에서 위치 보기"); mb.type = "button";
          mb.addEventListener("click", function () { showOnMap(p.no); });
          links.appendChild(mb);
        }
        var a = el("a", "map", "네이버지도에서 보기 ›"); a.href = window.mapLink(p); a.target = "_blank"; a.rel = "noopener";
        links.appendChild(a);
        body.appendChild(links);
        card.appendChild(body); list.appendChild(card);
      });
      sec.appendChild(list); root.appendChild(sec);
    });
    if (!any) root.appendChild(el("p", "memo", "조건에 맞는 식당이 없어요. 위에서 다른 종류나 평가를 골라 보세요."));
    updateMarkers();
  }

  // ---- 지도 ----
  var map = null, layer = null, markers = {};
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function initMap() {
    if (!window.L) { document.getElementById("map").textContent = "지도를 불러오지 못했어요. 아래 목록의 네이버지도 링크를 이용해 주세요."; return; }
    if (!C.lat) { C.lat = 37.52293; C.lng = 126.90609; }
    map = L.map("map", { scrollWheelZoom: false, tap: true }).setView([C.lat, C.lng], 16);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
    L.marker([C.lat, C.lng], { icon: L.divIcon({ className: "", html: '<div class="pin home">의원</div>', iconSize: [34, 34], iconAnchor: [17, 17] }), zIndexOffset: 1000 })
      .addTo(map).bindPopup("<b>어전트의원</b><br>" + esc(C.address));
    layer = L.layerGroup().addTo(map);
  }
  function updateMarkers() {
    if (!map) return;
    layer.clearLayers(); markers = {};
    var pts = [[C.lat, C.lng]];
    P.filter(match).forEach(function (p) {
      if (!p.lat) return;
      var lv = window.levelOf(p);
      var cls = "pin" + (lv === "강추" ? " top" : lv === "추천" ? "" : " mixed");
      var m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: "", html: '<div class="' + cls + '">' + p.no + "</div>", iconSize: [26, 26], iconAnchor: [13, 13] }) });
      var html = "<b>" + p.no + ". " + esc(p.name) + "</b>" + (lv ? " · " + lv : "") + "<br>" + esc(p.cat) + (p.price && window.PRICE_LABEL ? " · " + window.PRICE_LABEL[p.price] : "") +
        (p.memo ? "<br>" + esc(p.memo) : "") +
        '<br><a href="' + window.mapLink(p) + '" target="_blank" rel="noopener">네이버지도 ›</a> &nbsp; <a href="#p' + p.no + '">목록에서 보기</a>';
      m.bindPopup(html, { maxWidth: 260 });
      m.addTo(layer); markers[p.no] = m; pts.push([p.lat, p.lng]);
    });
    if (pts.length > 1) map.fitBounds(pts, { padding: [24, 24], maxZoom: 17 });
  }
  function showOnMap(no) {
    var m = markers[no]; if (!m) return;
    document.querySelector(".mapbox").scrollIntoView({ behavior: "smooth", block: "start" });
    map.setView(m.getLatLng(), 18); m.openPopup();
  }
  initMap();

  document.getElementById("pickBtn").addEventListener("click", function () {
    var pool = P.filter(match);
    if (!pool.length) { document.getElementById("pickName").textContent = "조건에 맞는 곳이 없어요"; return; }
    var p = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById("pickName").textContent = p.no + ". " + p.name;
    render(p.no);
    var t = document.getElementById("p" + p.no);
    if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  });

  render();
})();
</script>
</body>
</html>
